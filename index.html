<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="MSSO (2).png">
<title>酷熱指數｜體感溫度｜露點溫度計算 | 澳門民間氣象台 MSSO</title>
<style>
/* ========== 1. 深太空 (Deep Space) 全域主題基礎 ========== */
:root {
  --bg-dark: #0b0f19;
  --card-bg: rgba(22, 30, 46, 0.75);
  --card-bg-light: rgba(255, 255, 255, 0.03);
  --card-border: rgba(255, 255, 255, 0.08);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  
  --accent-blue: #38bdf8;
  --accent-teal: #2dd4bf;
  --accent-green: #34d399;
  --accent-yellow: #facc15;
  --accent-orange: #f59e0b;
  --accent-red: #ef4444;
  --accent-purple: #c084fc;
}

html {
  scroll-behavior: smooth;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  line-height: 1.6;
}

/* 頁面最大寬度容器 */
.page-wrapper {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 15px 40px 15px;
}

/* ========== 2. 頁頭 Header & 頂欄玻璃擬態導航 ========== */
.header-nav-container {
  position: sticky;
  top: 0;
  z-index: 3000;
  background: rgba(11, 15, 25, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1.5rem;
  margin-bottom: 25px;
}
.header {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  height: 38px;
  width: auto;
  filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.3));
}
.title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent-blue);
  letter-spacing: 0.5px;
}

/* 導航菜單 */
.menu-container {
  position: relative;
}
.menu-toggle {
  display: none;
  font-size: 22px;
  padding: 6px 12px;
  cursor: pointer;
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  border-radius: 8px;
  transition: all 0.2s;
}
.menu-toggle:hover {
  border-color: var(--accent-blue);
}
.nav {
  display: flex;
  gap: 6px;
}
.nav a {
  color: var(--text-muted);
  padding: 8px 14px;
  font-size: 0.92rem;
  font-weight: 500;
  text-decoration: none;
  border-radius: 20px;
  transition: all 0.2s ease;
}
.nav a:hover, .nav a.active {
  color: var(--text-main);
  background: rgba(56, 189, 248, 0.15);
  color: var(--accent-blue);
}

/* ========== 3. 計算器佈局與深空面板卡片 ========== */
.calc-wrap {
  display: grid;
  grid-template-columns: 1fr;
  gap: 28px;
  margin: 0 auto;
  max-width: 900px;
}

.calc-card {
  border: 1px solid var(--card-border);
  border-radius: 16px;
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  padding: 26px;
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}
.calc-card:hover {
  transform: translateY(-3px);
  border-color: rgba(56, 189, 248, 0.35);
  box-shadow: 0 12px 32px rgba(56, 189, 248, 0.12);
}
.card-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--accent-teal);
  margin: 0 0 20px 0;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--card-border);
  letter-spacing: 0.5px;
}

/* ========== 4. 表單輸入區樣式 ========== */
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
.form-full {
  margin-bottom: 16px;
}
label {
  display: block;
  font-size: 14px;
  margin-bottom: 6px;
  color: var(--text-muted);
  font-weight: 500;
}
input, select {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--card-border);
  border-radius: 10px;
  font-size: 15px;
  background: rgba(15, 23, 42, 0.6);
  color: var(--text-main);
  transition: all 0.2s ease;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--accent-blue);
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
}
input::placeholder {
  color: #64748b;
}

/* ========== 5. 按鈕樣式 ========== */
.btn-row {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 12px;
  margin-top: 12px;
}
.calc-btn {
  padding: 12px;
  border: none;
  border-radius: 25px;
  background: linear-gradient(135deg, var(--accent-blue), #0284c7);
  color: #ffffff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25);
}
.calc-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(56, 189, 248, 0.4);
}
.clear-btn {
  padding: 12px;
  border: 1px solid var(--card-border);
  border-radius: 25px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-muted);
  font-size: 14.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.25s ease;
}
.clear-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: var(--text-main);
}

/* ========== 6. 結果輸出框與分級配色 ========== */
.result-box {
  margin-top: 20px;
  padding: 16px;
  background: rgba(15, 23, 42, 0.65);
  border-left: 5px solid var(--accent-teal);
  border-radius: 10px;
  font-size: 15px;
  line-height: 1.7;
  min-height: 48px;
  white-space: pre-line;
  border-top: 1px solid var(--card-border);
  border-right: 1px solid var(--card-border);
  border-bottom: 1px solid var(--card-border);
  transition: all 0.3s ease;
}
.result-empty {
  color: var(--text-muted);
  border-left-color: var(--text-muted);
}
.result-error {
  border-left-color: var(--accent-red);
  background: rgba(239, 68, 68, 0.12);
  color: #fecfcf;
}

/* 體感溫度 AT 10級側邊框風格 */
.at-lv10 { border-left-color: #7f1d1d; background: rgba(127, 29, 29, 0.25); color: #fecfcf; }
.at-lv9  { border-left-color: #991b1b; background: rgba(153, 27, 27, 0.25); color: #fecfcf; }
.at-lv8  { border-left-color: #dc2626; background: rgba(220, 38, 38, 0.25); color: #fee2e2; }
.at-lv7  { border-left-color: #ea580c; background: rgba(234, 88, 12, 0.25); color: #ffedd5; }
.at-lv6  { border-left-color: #d97706; background: rgba(217, 119, 6, 0.25); color: #fef3c7; }
.at-lv5  { border-left-color: #ca8a04; background: rgba(202, 138, 4, 0.25); color: #fef9c3; }
.at-lv4  { border-left-color: #059669; background: rgba(5, 150, 105, 0.25); color: #d1fae5; }
.at-lv3  { border-left-color: #0284c7; background: rgba(2, 132, 199, 0.25); color: #e0f2fe; }
.at-lv2  { border-left-color: #4f46e5; background: rgba(79, 70, 229, 0.25); color: #e0e7ff; }
.at-lv1  { border-left-color: #7c3aed; background: rgba(124, 58, 237, 0.25); color: #ede9fe; }

/* 酷熱指數 HI 4級風格 */
.hi-lv4 { border-left-color: #450a0a; background: rgba(69, 10, 10, 0.35); color: #fee2e2; }
.hi-lv3 { border-left-color: #b91c1c; background: rgba(185, 28, 28, 0.25); color: #fecfcf; }
.hi-lv2 { border-left-color: #c2410c; background: rgba(194, 65, 12, 0.25); color: #ffedd5; }
.hi-lv1 { border-left-color: #b45309; background: rgba(180, 83, 9, 0.25); color: #fef3c7; }

/* 露點 Td 3級風格 */
.td-lv3 { border-left-color: #6b21a8; background: rgba(107, 33, 168, 0.25); color: #f3e8ff; }
.td-lv2 { border-left-color: #991b1b; background: rgba(153, 27, 27, 0.25); color: #fee2e2; }
.td-lv1 { border-left-color: #047857; background: rgba(4, 120, 87, 0.25); color: #d1fae5; }

/* ========== 7. 響應式適配 Responsive ========== */
@media (max-width: 768px) {
  .header-nav-container {
    padding: 0.75rem 1rem;
  }
  .menu-toggle {
    display: block;
  }
  .nav {
    display: none;
    flex-direction: column;
    width: 220px;
    position: absolute;
    top: 48px;
    right: 0;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .nav a {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
  }
  .nav.active {
    display: flex;
  }
  .form-row {
    grid-template-columns: 1fr;
  }
  .calc-card {
    padding: 20px;
  }
}
</style>
</head>
<body>

<!-- Header Nav 全站統一玻璃擬態深空導航 -->
<header class="header-nav-container">
  <div class="header">
    <img src="MSSO (2).png" alt="MSSO Logo" class="logo">
    <div class="title">澳門民間氣象台 MSSO</div>
  </div>
  <div class="menu-container">
    <button class="menu-toggle" id="menuToggle" onclick="toggleMenu()" aria-label="Toggle Navigation">☰</button>
    <nav class="nav" id="navMenu">
      <a href="https://macaosso.github.io/MSSOweb/index.html">首頁</a>
      <a href="https://macaosso.github.io/Apparent_Temperature/" class="active">酷熱指數</a>
      <a href="https://macaosso.github.io/MSSOweb/cal_dis.html">熱帶氣旋距離計算工具</a>
      <a href="https://macaosso.github.io/MSSOweb/tc_gis.html">熱帶氣旋路徑地圖</a>
      <a href="https://macaosso.github.io/MSSOweb/tc.html">熱帶氣旋資訊</a>
      <a href="https://macaosso.github.io/MSSOweb/about.html">關於我們</a>
      <a href="https://macaosso.github.io/MSSOweb/ver.html">版本記錄</a>
    </nav>
  </div>
</header>

<!-- 主內容頁面容器 -->
<div class="page-wrapper">
  <div class="calc-wrap">
  
    <!-- 1. 體感溫度 AT 計算 -->
    <div class="calc-card">
      <div class="card-title">體感溫度 Apparent Temperature (AT)</div>
      <div class="form-row">
        <div>
          <label for="at_T">氣溫 T (℃)</label>
          <input id="at_T" type="number" step="0.1" placeholder="例如：31.5">
        </div>
        <div>
          <label for="at_RH">相對濕度 RH (%)</label>
          <input id="at_RH" type="number" step="1" placeholder="例如：75">
        </div>
      </div>
      <div class="form-full">
        <label for="at_V">風速 V (km/h)</label>
        <input id="at_V" type="number" step="0.1" placeholder="例如：12.0">
      </div>
      <div class="btn-row">
        <button class="calc-btn" onclick="calcAT()">計算體感溫度</button>
        <button class="clear-btn" onclick="clearAT()">清空</button>
      </div>
      <div id="resAT" class="result-box result-empty">體感溫度計算結果</div>
    </div>

    <!-- 2. 酷熱指數 HI 計算 -->
    <div class="calc-card">
      <div class="card-title">酷熱指數 Heat Index (HI)</div>
      <div class="form-row">
        <div>
          <label for="hi_T">氣溫 T (℃)</label>
          <input id="hi_T" type="number" step="0.1" placeholder="例如：33.0">
        </div>
        <div>
          <label for="hi_RH">相對濕度 RH (%)</label>
          <input id="hi_RH" type="number" step="1" placeholder="例如：70">
        </div>
      </div>
      <div class="btn-row">
        <button class="calc-btn" onclick="calcHI()">計算酷熱指數</button>
        <button class="clear-btn" onclick="clearHI()">清空</button>
      </div>
      <div id="resHI" class="result-box result-empty">酷熱指數計算結果</div>
    </div>

    <!-- 3. 露點溫度 Td 計算 -->
    <div class="calc-card">
      <div class="card-title">露點溫度 Dew Point (Td)</div>
      <div class="form-row">
        <div>
          <label for="td_T">氣溫 T (℃)</label>
          <input id="td_T" type="number" step="0.1" placeholder="例如：28.0">
        </div>
        <div>
          <label for="td_RH">相對濕度 RH (%)</label>
          <input id="td_RH" type="number" step="1" placeholder="例如：80">
        </div>
      </div>
      <div class="btn-row">
        <button class="calc-btn" onclick="calcTd()">計算露點溫度</button>
        <button class="clear-btn" onclick="clearTd()">清空</button>
      </div>
      <div id="resTd" class="result-box result-empty">露點溫度計算結果</div>
    </div>

  </div>
</div>

<script>
// 移動端選單開關
function toggleMenu() {
  const nav = document.getElementById("navMenu");
  const btn = document.getElementById("menuToggle");
  nav.classList.toggle("active");
  btn.innerHTML = nav.classList.contains("active") ? "✕" : "☰";
}

// 點擊選單外部自動關閉
document.addEventListener('click', (e) => {
  const nav = document.getElementById("navMenu");
  const btn = document.getElementById("menuToggle");
  if (!btn.contains(e.target) && !nav.contains(e.target)) {
    nav.classList.remove("active");
    btn.innerHTML = "☰";
  }
});

// ====================== 1.體感溫度 AT + 10檔分級判斷 ======================
function calcAT(){
  const T = Number(document.getElementById("at_T").value);
  const RH = Number(document.getElementById("at_RH").value);
  const V = Number(document.getElementById("at_V").value);
  const resDom = document.getElementById("resAT");
  resDom.className = "result-box";

  if(isNaN(T) || isNaN(RH) || isNaN(V) || RH < 0 || RH > 100 || V < 0){
    resDom.className = "result-box result-error";
    resDom.innerText = "輸入數據異常：請填寫有效數值（濕度 0~100%，風速 ≥ 0）";
    return;
  }

  const e = (RH/100) * 6.105 * Math.exp((17.27 * T) / (237.7 + T));
  const AT = 1.04 * T + 0.2 * e - 0.65 * V - 2.7;

  let levelText = "", levelClass = "";
  if(AT >= 37.5)      { levelText = "極為酷熱"; levelClass = "at-lv10"; }
  else if(AT >= 35.5) { levelText = "非常酷熱"; levelClass = "at-lv9"; }
  else if(AT >= 32.5) { levelText = "酷熱"; levelClass = "at-lv8"; }
  else if(AT >= 27.5) { levelText = "炎熱"; levelClass = "at-lv7"; }
  else if(AT >= 22.5) { levelText = "溫暖"; levelClass = "at-lv6"; }
  else if(AT >= 17.5) { levelText = "和暖"; levelClass = "at-lv5"; }
  else if(AT >= 12.5) { levelText = "清涼"; levelClass = "at-lv4"; }
  else if(AT >= 7.5)  { levelText = "寒冷"; levelClass = "at-lv3"; }
  else if(AT >= 3.5)  { levelText = "非常寒冷"; levelClass = "at-lv2"; }
  else                { levelText = "極為寒冷"; levelClass = "at-lv1"; }

  resDom.classList.add(levelClass);
  resDom.innerText = `體感溫度 AT = ${AT.toFixed(1)} ℃\n等級：${levelText}`;
}

function clearAT(){
  ["at_T", "at_RH", "at_V"].forEach(id => document.getElementById(id).value = "");
  const dom = document.getElementById("resAT");
  dom.innerText = "體感溫度計算結果";
  dom.className = "result-box result-empty";
}

// ====================== 2.酷熱指數 HI + 4檔危險分級 ======================
function calcHI(){
  const Tc = Number(document.getElementById("hi_T").value);
  const RH = Number(document.getElementById("hi_RH").value);
  const resDom = document.getElementById("resHI");
  resDom.className = "result-box";

  if(isNaN(Tc) || isNaN(RH) || RH < 0 || RH > 100){
    resDom.className = "result-box result-error";
    resDom.innerText = "數據錯誤：請填寫有效數值（相對濕度範圍 0~100%）";
    return;
  }

  const Tf = Tc * 1.8 + 32;
  let HI = -42.379
          + 2.04901523 * Tf
          + 10.14333127 * RH
          - 0.22475541 * Tf * RH
          - 0.00683783 * Tf * Tf
          - 0.05481717 * RH * RH
          + 0.00122874 * Tf * Tf * RH
          + 0.00085282 * Tf * RH * RH
          - 0.00000199 * Tf * Tf * RH * RH;

  const HIc = (HI - 32) / 1.8;
  let note = "";
  if(Tc < 26.7){
    note = "\n⚠️ 注意：NOAA 酷熱指數公式建議僅適用於氣溫 ≥ 26.7℃";
  }

  let levelText = "", levelClass = "";
  if(HIc >= 54.5)      { levelText = "極度危險"; levelClass = "hi-lv4"; }
  else if(HIc >= 49.5) { levelText = "非常危險"; levelClass = "hi-lv3"; }
  else if(HIc >= 44.5) { levelText = "危險";     levelClass = "hi-lv2"; }
  else if(HIc >= 39.5) { levelText = "警戒";     levelClass = "hi-lv1"; }
  else                 { levelText = "正常 (低於警戒線)"; }

  if(levelClass) resDom.classList.add(levelClass);
  resDom.innerText = `酷熱指數 HI = ${HI.toFixed(1)} ℉ ≈ ${HIc.toFixed(1)} ℃ \n等級：${levelText}${note}`;
}

function clearHI(){
  ["hi_T", "hi_RH"].forEach(id => document.getElementById(id).value = "");
  const dom = document.getElementById("resHI");
  dom.innerText = "酷熱指數計算結果";
  dom.className = "result-box result-empty";
}

// ====================== 3.露點溫度 Td + 3檔舒適分級 ======================
function calcTd(){
  const T = Number(document.getElementById("td_T").value);
  const RH = Number(document.getElementById("td_RH").value);
  const resDom = document.getElementById("resTd");
  resDom.className = "result-box";

  if(isNaN(T) || isNaN(RH) || RH <= 0 || RH > 100){
    resDom.className = "result-box result-error";
    resDom.innerText = "濕度錯誤：相對濕度需介於 0% 至 100% 之間";
    return;
  }

  const a = 17.27, b = 237.7;
  const gamma = (a * T) / (b + T) + Math.log(RH / 100);
  const Td = (b * gamma) / (a - gamma);

  let levelText = "", levelClass = "";
  if(Td >= 28)      { levelText = "危險 (極度悶熱)"; levelClass = "td-lv3"; }
  else if(Td >= 24) { levelText = "悶熱";          levelClass = "td-lv2"; }
  else if(Td >= 18) { levelText = "舒適";          levelClass = "td-lv1"; }
  else              { levelText = "乾爽舒適"; }

  if(levelClass) resDom.classList.add(levelClass);
  resDom.innerText = `露點溫度 Td = ${Td.toFixed(1)} ℃\n等級：${levelText}`;
}

function clearTd(){
  ["td_T", "td_RH"].forEach(id => document.getElementById(id).value = "");
  const dom = document.getElementById("resTd");
  dom.innerText = "露點溫度計算結果";
  dom.className = "result-box result-empty";
}
</script>
</body>
</html>
